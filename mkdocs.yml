# 阅读站点配置。
#
# 文档源不是仓库根，而是 scripts/build-site.mjs 生成的 .site-src/。
# 构建流程：node scripts/build-site.mjs && mkdocs build
#
# nav 由 scripts/gen-nav.mjs 生成（见下面的 AUTO:NAV 标记），不要手改。
#
# 原先是交给 MkDocs 自动生成的，但它的隐式导航**只认目录名**——
# `01-ai-for-animals` 会显示成「01 ai for animals」，`datasets` 显示成「Datasets」，
# 而目录名必须是英文小写（链接和 URL 要用），改不了。结果侧边栏是
# 「Directions / Datasets / Papers / Behavior」这种中英混排。
#
# 顺带解决了两件事：同级顺序按方向 README 任务表的阅读顺序排（字母序不是阅读顺序），
# 年份文件新的在前（和各级 README 的收录表一致）。

site_name: 教研室 AI+动物 文献资料库
site_description: AI+动物方向的公开文献索引——论文、综述、数据集，按任务与年份归档
docs_dir: .site-src
site_dir: site

