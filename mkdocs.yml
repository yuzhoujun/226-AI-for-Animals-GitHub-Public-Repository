# 默认是 GitHub Pages 的地址。镜像到 226 服务器（挂在子路径下）时用环境变量覆盖：
#   SITE_URL=https://<你的域名>/ai-animals/ mkdocs build --strict
# 这个值决定站内绝对链接和 search 索引的前缀，部署在子路径下必须改，否则链接会指到根。
site_url: !ENV [SITE_URL, "https://yuzhoujun.github.io/226-AI-for-Animals-GitHub-Public-Repository/"]

# 站点右上角的「编辑此页」，以及 CONTRIBUTING 里指向 .github/ 的链接都靠它拼绝对地址
repo_url: https://github.com/yuzhoujun/226-AI-for-Animals-GitHub-Public-Repository
repo_name: yuzhoujun/226-AI-for-Animals
edit_uri: edit/main/

theme:
  name: material
  language: zh
  features:
    - navigation.indexes # 用 index.md 作为该节的落地页与标题
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: 切换到深色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色

plugins:
  # 装了 jieba 之后中文检索会按词切分，明显好于默认的逐字切分（见 requirements.txt）
  - search

markdown_extensions:
  - tables
  - toc:
      permalink: true
      # 默认的 slugify 会把非 ASCII 字符整段丢掉，中文标题于是生成空锚点，
      # 站内所有 #中文标题 的链接全部失效（CONTRIBUTING 的目录就是重灾区）。
      # pymdownx 的 slugify 保留 Unicode 词字符，切出来的锚点和 GitHub 一致：
      # 「## 方式一：网页直接编辑」→ #方式一网页直接编辑，两边的链接可以互相跳。
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - admonition
  - attr_list
  - md_in_html

# templates/ 是填写模板，站点上保留（CONTRIBUTING 里有链接指过来）但不进导航
not_in_nav: |
  templates/
