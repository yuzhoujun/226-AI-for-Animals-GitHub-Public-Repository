name: 链接检查

# 本仓库里几乎全是外链（arXiv、DOI、数据集官网），失效是常态。
# PR 上只提示不拦截；每周一自动扫一遍，有失效就开 Issue。

on:
  pull_request:
  schedule:
    # 每周一 02:17 UTC（北京时间 10:17）。避开整点，减少和别的任务撞车。
    - cron: "17 2 * * 1"
  workflow_dispatch:

jobs:
  link-check:
    # 同上：让检查名和 workflow 名一致
    name: 链接检查
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      # PR 上要把扫描结果贴成评论（只提示不拦人）。少了这个，评论那一步会被拒。
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: 用 lychee 扫描 Markdown 中的链接
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # fail: false —— arXiv 偶尔限流会误报，不让它拦住 PR。
          # 但「不拦」不等于「不说」：结果会由下一步贴成 PR 评论，
          # 真正漏掉的由下面的定时任务开 Issue 兜底。
          fail: false
          output: ./lychee/out.md
          args: >-
            --no-progress
            --max-concurrency 4
            --timeout 30
            --max-retries 3
            --retry-wait-time 5
            --accept 200,206,429
            --exclude '^https?://localhost'
            --exclude '^https?://github\.com/xxx/'
            --exclude '^https?://doi\.org/10\.1109/XXXX'
            --exclude '^https?://arxiv\.org/abs/2501\.01234'
            --exclude '^https?://(www\.)?example\.(org|com)'
            './**/*.md'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 上面那几条 --exclude 都是 templates/ 和 CONTRIBUTING 里的**占位示例**
      # （github.com/xxx/yyy、XXXX 的假 DOI、example.org、2501.01234 这个假 arXiv 号）。
      # 它们是给人看格式用的，本来就点不开。不排掉的话每周一都会拿这同几条
      # 开一个新 Issue，永远关不掉。

      # PR 上把结果贴成评论。合并之前就能看见「这条链接打不开」，
      # 而不是等下周一的定时任务来告诉你。
      #
      # 只对**本仓库分支**的 PR 有效：来自 fork 的 PR，GitHub 给的 token 是只读的，
      # 评论会被拒（这是 GitHub 的安全设计，不是配置问题）。那种 PR 只能靠每周的 Issue 兜底。
      # 机器人开的 PR 分支是 issue-<编号>，属于本仓库，所以走得到这里。
      - name: 把结果贴到 PR 上（只提示，不拦人）
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        env:
          # lychee 的退出码：0 = 全部正常
          LYCHEE_EXIT: ${{ steps.lychee.outputs.exit_code }}
        with:
          script: |
            const fs = require('fs');
            const clean = process.env.LYCHEE_EXIT === '0';
            const TAG = '<!-- link-check -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            // 认自己上次留的那条，重复跑就改它，不刷屏
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );
            const mine = comments.find((c) => c.body && c.body.includes(TAG));

            // 全绿且没留过言：什么都不做，别给每个 PR 都塞一条「没问题」
            if (clean && !mine) return;

            // 报告文件偶尔会因为 lychee 提前退出而不存在，缺了也不能让这一步炸掉——
            // 它本来就是个「只提示」的步骤，自己失败反而更吵。
            let report = '';
            try {
              report = fs.readFileSync('lychee/out.md', 'utf8');
            } catch {
              report = '（拿不到扫描报告，去 Actions 页面看这一步的日志）';
            }

            const body = clean
              ? `${TAG}\n✅ 外链检查没发现问题。\n\n` +
                `> 这一项只提示不拦截——arXiv 偶尔限流，误报比漏报多。`
              : `${TAG}\n⚠️ 扫到几个打不开的链接。**不拦合并**，但麻烦点开确认一下：\n\n` +
                `- 真失效 → 换成 DOI 链接（\`doi.org/...\`）\n` +
                `- arXiv 限流导致的误报 → 不用管，下周复扫会自己消失\n\n` +
                `<details><summary>扫描详情</summary>\n\n` +
                report +
                `\n</details>\n`;

            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: 按扫描结果维护 Issue
        if: github.event_name == 'schedule'
        uses: actions/github-script@v7
        env:
          # lychee 的退出码：0 = 全部正常
          LYCHEE_EXIT: ${{ steps.lychee.outputs.exit_code }}
        with:
          script: |
            const fs = require('fs');
            const clean = process.env.LYCHEE_EXIT === '0';
            const TITLE = '链接检查发现失效链接';
            const LABEL = 'broken-link';

            // 只认机器人自己开的那条。人工用「报告失效链接」模板开的 Issue
            // 也带 broken-link 标签，不该被这个任务关掉。
            const mine = (await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: LABEL,
              state: 'open',
              per_page: 100,
            })).data.filter(
              (i) => i.user.login === 'github-actions[bot]' && i.title.startsWith(TITLE)
            );

            // 恢复正常：把还开着的旧 Issue 关掉，否则修好了也没人知道
            if (clean) {
              for (const issue of mine) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: '本周复扫所有链接均正常，自动关闭。\n\n（如果又发现问题，下周一会自动开新的。）',
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed',
                });
              }
              core.info(
                mine.length === 0
                  ? '链接正常，没有待处理的 Issue。'
                  : `链接正常，关闭了 ${mine.length} 条旧 Issue。`
              );
              return;
            }

            const body = fs.readFileSync('lychee/out.md', 'utf8');

            // 已经有开着的就补评论，不再开新的——否则一年下来能攒 52 条重复 Issue
            if (mine.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: mine[0].number,
                body: `本周复扫，以下链接仍然失效：\n\n${body}`,
              });
              core.info(`问题依旧，已在 #${mine[0].number} 下追加评论。`);
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: TITLE,
              body,
              labels: [LABEL],
            });
            core.info('开了新的失效链接 Issue。');
