name: 同步标签

# 仓库用到的标签在这里统一声明，推到 main 时自动建好。
#
# 为什么要有这个：Issue 表单和 workflow 里写的 labels 只是「名字」，
# GitHub **不会**自动创建它们——标签不存在就被静默丢掉。表现出来就是
# 「表单里明明写了 labels: [auto-pr]，开出来的 issue 却一个标签都没有」，
# 以及自动开 PR 那一步因为标签不存在而失败。
#
# 与其让人去网页上一个一个点，不如让它在推代码时自己建好。重复跑没关系，
# 已经存在的标签会跳过（不会覆盖你手动改过的颜色和描述）。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // 标签的「唯一事实来源」就是这个列表。加新标签往这里加。
            const WANTED = [
              // 机器人开的 PR 挂这个，方便维护者筛出来审
              { name: '待审核', color: 'fbca04', description: '等待维护者审核（多为机器人开的 PR）' },

              // 下面三个由 .github/ISSUE_TEMPLATE/ 里的表单自动打上。
              // 机器人靠它们判断投稿的是论文、综述还是数据集。
              { name: 'auto-pr', color: '0e8a16', description: '由 Issue 表单提交，会自动转成 PR' },
              { name: 'add-paper', color: '1d76db', description: '提交一篇论文' },
              { name: 'add-survey', color: '1d76db', description: '提交一篇综述' },
              { name: 'add-dataset', color: '1d76db', description: '提交一个数据集' },

              // 其余模板用到的
              { name: 'broken-link', color: 'd73a4a', description: '链接打不开了（人工报告或每周自动扫描）' },
              { name: 'new-direction', color: '5319e7', description: '申请新增研究方向' },
            ];

            const { owner, repo } = context.repo;
            let created = 0;

            for (const label of WANTED) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: label.name });
                core.info(`已存在，跳过：${label.name}`);
              } catch (e) {
                if (e.status !== 404) throw e;
                await github.rest.issues.createLabel({ owner, repo, ...label });
                core.info(`新建：${label.name}`);
                created++;
              }
            }

            core.notice(created ? `新建了 ${created} 个标签。` : '所有标签都已存在，无需改动。');
