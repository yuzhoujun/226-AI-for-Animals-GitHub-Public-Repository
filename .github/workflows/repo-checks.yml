name: 仓库一致性检查

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # README 里的统计块由 scripts/gen-index.mjs 生成。
      # 加了论文却没重新生成，这里会失败并提示怎么修。
      - name: 校验统计块是否为最新
        run: node scripts/gen-index.mjs --check

      # 指向不存在文件的相对链接（比如尚未创建的任务目录）
      - name: 校验仓库内相对链接
        run: node scripts/check-links.mjs
