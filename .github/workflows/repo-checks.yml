name: 仓库一致性检查

on:
  push:
    branches: [main]
  pull_request:
    # 机器人开的 PR 分支是 issue-<编号>，由 issue-to-pr.yml 开完 PR 自己点火跑，
    # 见那边的注释。这里排除掉，GitHub 就**不会创建**「等待批准」的那种运行，
    # PR 上那条「N workflows awaiting approval」黄条也就不会再出现了。
    #
    # 用分支名而不是别的条件，是因为扣留发生在运行创建之前——job 级的 if
    # 拦不住它，只有让运行压根不生成。
    #
    # 副作用：人工分支也不能叫 issue- 开头，否则检查不会被触发（分支保护会把它
    # 拦在「Expected — waiting」）。CONTRIBUTING 里写明了这条。
    branches-ignore:
      - "issue-*"
  workflow_dispatch:

jobs:
  checks:
    # name 决定这条检查在 PR 上叫什么，也是分支保护里能勾到的名字。
    # 不写的话显示成 job id「checks」——和 workflow 名对不上，你去勾的时候
    # 会在列表里找不到「仓库一致性检查」。
    name: 仓库一致性检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # README 里的统计块由 scripts/gen-index.mjs 生成。
      # 加了论文却没重新生成，这里会失败并提示怎么修。
      - name: 校验统计块是否为最新
        run: node scripts/gen-index.mjs --check

      # Issue 表单的任务下拉框也是生成的，来源同样是方向 README 的任务表。
      # 以前是手抄的，而且只抄了「已经有目录的」——登记为「待建」的任务
      # 在表单里根本选不到，想投第一篇的人无处可投。
      - name: 校验任务下拉框是否为最新
        run: node scripts/gen-forms.mjs --check

      # 站点导航（mkdocs.yml 里的 nav）也是生成的：MKdocs 的隐式导航只认目录名，
      # 会把 01-ai-for-animals 显示成「01 ai for animals」。加了任务目录没重跑，
      # 这里失败，否则要等 mkdocs build --strict 报「有页面不在 nav 里」。
      - name: 校验站点导航是否为最新
        run: node scripts/gen-nav.mjs --check

      # 指向不存在文件的相对链接（比如尚未创建的任务目录）
      - name: 校验仓库内相对链接
        run: node scripts/check-links.mjs

      # 上一项只管「文件在不在」。这一项管「那条在不在」——正文里写
      # [某论文](2024.md)，结果这篇按发表年挪去了 2025.md，文件还在、
      # 链接也不 404，但读者点过去找不到。统计块是脚本生成的不会错，
      # 会错的是它旁边手写的那段话。
      - name: 校验正文交叉引用
        run: node scripts/check-xref.mjs
