name: 仓库一致性检查

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # README 里的统计块由 scripts/gen-index.mjs 生成。
      # 加了论文却没重新生成，这里会失败并提示怎么修。
      - name: 校验统计块是否为最新
        run: node scripts/gen-index.mjs --check

      # Issue 表单的任务下拉框也是生成的，来源同样是方向 README 的任务表。
      # 以前是手抄的，而且只抄了「已经有目录的」——登记为「待建」的任务
      # 在表单里根本选不到，想投第一篇的人无处可投。
      - name: 校验任务下拉框是否为最新
        run: node scripts/gen-forms.mjs --check

      # 指向不存在文件的相对链接（比如尚未创建的任务目录）
      - name: 校验仓库内相对链接
        run: node scripts/check-links.mjs

      # 上一项只管「文件在不在」。这一项管「那条在不在」——正文里写
      # [某论文](2024.md)，结果这篇按发表年挪去了 2025.md，文件还在、
      # 链接也不 404，但读者点过去找不到。统计块是脚本生成的不会错，
      # 会错的是它旁边手写的那段话。
      - name: 校验正文交叉引用
        run: node scripts/check-xref.mjs
