name: Markdown 格式检查

on:
  push:
    branches: [main]
  pull_request:
    # 同 repo-checks.yml：机器人开的 PR 分支不在这里触发，改由机器人自己点火。
    # 这样 GitHub 不会创建「等待批准」的运行，PR 上不会出现「awaiting approval」黄条。
    branches-ignore:
      - "issue-*"
  workflow_dispatch:

jobs:
  markdownlint:
    # 同上：不写 name 的话，分支保护列表里显示的是 job id「markdownlint」
    name: Markdown 格式检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: "**/*.md"

      # 格式问题大多能自动修。本地跑 `npx markdownlint-cli2 --fix "**/*.md"` 即可。
